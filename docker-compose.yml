services:
  app:
    build: .
    container_name: compostmodernism
    restart: unless-stopped
    env_file: .env
    environment:
      # adapter-node defaults to 512KB; raise to match Caddy's request_body
      # max_size so image uploads aren't capped at the inner layer.
      BODY_SIZE_LIMIT: 20971520
    volumes:
      - ./posts.db:/app/posts.db
      - ./archive:/app/archive
    networks:
      - web

# `web` is the gateway's shared network — Caddy reaches this container by
# its `container_name`. No host ports published.
networks:
  web:
    external: true
